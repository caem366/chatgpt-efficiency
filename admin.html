<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Evaluation Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }

        .status-card {
            background: rgba(248, 249, 250, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #5d6d7e;
            margin-top: 8px;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            min-width: 200px;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(102, 126, 234, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.5);
            background: rgba(102, 126, 234, 1);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .populate-btn { background: rgba(39, 174, 96, 0.9); }
        .populate-btn:hover { background: rgba(39, 174, 96, 1); box-shadow: 0 8px 24px rgba(39, 174, 96, 0.5); }

        .process-btn { background: rgba(52, 152, 219, 0.9); }
        .process-btn:hover { background: rgba(52, 152, 219, 1); box-shadow: 0 8px 24px rgba(52, 152, 219, 0.5); }

        .results-btn { background: rgba(243, 156, 18, 0.9); }
        .results-btn:hover { background: rgba(243, 156, 18, 1); box-shadow: 0 8px 24px rgba(243, 156, 18, 0.5); }

        .progress-area {
            background: rgba(248, 249, 250, 0.6);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry.success {
            border-left-color: #27ae60;
            background: rgba(200, 230, 201, 0.6);
        }

        .log-entry.error {
            border-left-color: #e74c3c;
            background: rgba(255, 235, 238, 0.6);
        }

        .log-entry.progress {
            border-left-color: #3498db;
            background: rgba(227, 242, 253, 0.6);
        }

        .timestamp {
            color: #7f8c8d;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .results-area {
            background: rgba(248, 249, 250, 0.6);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 20px;
        }

        .domain-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .domain-card {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .domain-card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .metric:last-child {
            border-bottom: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 ChatGPT Evaluation Admin Dashboard</h1>

        <div class="status-card">
            <h2>📊 Database Status</h2>
            <div class="status-grid">
                <div class="stat-box">
                    <div class="stat-value" id="totalQuestions">-</div>
                    <div class="stat-label">Total Questions</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="processedQuestions">-</div>
                    <div class="stat-label">Processed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="unprocessedQuestions">-</div>
                    <div class="stat-label">Unprocessed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalResults">-</div>
                    <div class="stat-label">Results Stored</div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="populate-btn" onclick="populateDatabase()">
                📥 Populate Database
            </button>
            <button onclick="resetProcessedStatus()">
                🔄 Reset to Unprocessed
            </button>
            <button class="process-btn" onclick="processQuestions()">
                ⚙️ Process Questions
            </button>
            <button style="background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);" onclick="autoProcess()">
                🚀 Auto-Process All
            </button>
            <button class="results-btn" onclick="fetchResults()">
                📈 View Results
            </button>
            <button onclick="refreshStatus()">
                🔄 Refresh Status
            </button>
        </div>

        <div class="status-card">
            <h3>🤖 Model Selection</h3>
            <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                <label style="font-weight: 600; color: #2c3e50;">Choose GPT Model:</label>
                <select id="modelSelect" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(102, 126, 234, 0.3); background: rgba(255,255,255,0.8); font-size: 1em; min-width: 200px;">
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Fast & Cheap)</option>
                    <option value="gpt-4">GPT-4 (Most Capable)</option>
                    <option value="gpt-4-turbo">GPT-4 Turbo (Faster GPT-4)</option>
                    <option value="gpt-4o">GPT-4o (Latest)</option>
                    <option value="gpt-4o-mini">GPT-4o Mini (Affordable)</option>
                </select>
                <label style="font-weight: 600; color: #2c3e50; margin-left: 20px;">Filter Results:</label>
                <select id="resultsModelFilter" style="padding: 10px; border-radius: 8px; border: 1px solid rgba(102, 126, 234, 0.3); background: rgba(255,255,255,0.8); font-size: 1em; min-width: 200px;">
                    <option value="">All Models</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="gpt-4">GPT-4</option>
                    <option value="gpt-4-turbo">GPT-4 Turbo</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                </select>
            </div>
        </div>

        <div class="progress-area">
            <h3>📝 Activity Log</h3>
            <div id="logArea"></div>
        </div>

        <div class="results-area" id="resultsArea" style="display: none;">
            <h2>📊 Evaluation Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        let ws;

        // Connect to WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                addLog('WebSocket connected', 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'progress') {
                    addLog(data.message, 'progress');
                }
            };
            
            ws.onerror = (error) => {
                addLog('WebSocket error', 'error');
            };
            
            ws.onclose = () => {
                addLog('WebSocket disconnected. Reconnecting...', 'error');
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Add log entry
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `
                <strong>${message}</strong>
                <div class="timestamp">${new Date().toLocaleTimeString()}</div>
            `;
            logArea.insertBefore(entry, logArea.firstChild);
            
            // Keep only last 50 entries
            while (logArea.children.length > 50) {
                logArea.removeChild(logArea.lastChild);
            }
        }

        // Refresh database status
        async function refreshStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalQuestions').textContent = data.database.totalQuestions;
                    document.getElementById('processedQuestions').textContent = data.database.processedQuestions;
                    document.getElementById('unprocessedQuestions').textContent = data.database.unprocessedQuestions;
                    document.getElementById('totalResults').textContent = data.database.totalResults;
                    
                    if (data.database.connected) {
                        addLog('✅ Status refreshed - MongoDB connected', 'success');
                    } else {
                        addLog('⚠️ MongoDB not connected - ' + (data.database.message || 'Please start MongoDB'), 'error');
                    }
                } else {
                    addLog(`❌ Error: ${data.error || 'Unknown error'}`, 'error');
                    document.getElementById('totalQuestions').textContent = '0';
                    document.getElementById('processedQuestions').textContent = '0';
                    document.getElementById('unprocessedQuestions').textContent = '0';
                    document.getElementById('totalResults').textContent = '0';
                }
            } catch (error) {
                addLog(`❌ Error refreshing status: ${error.message}`, 'error');
                document.getElementById('totalQuestions').textContent = '?';
                document.getElementById('processedQuestions').textContent = '?';
                document.getElementById('unprocessedQuestions').textContent = '?';
                document.getElementById('totalResults').textContent = '?';
            }
        }

        // Populate database
        async function populateDatabase() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Populating...';
            
            try {
                addLog('Starting database population...', 'progress');
                
                const response = await fetch('/api/populate', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                    refreshStatus();
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error populating database: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📥 Populate Database';
            }
        }

        // Process questions
        async function processQuestions() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Processing...';
            
            const selectedModel = document.getElementById('modelSelect').value;
            
            try {
                addLog(`Starting question processing with ${selectedModel}...`, 'progress');
                addLog('This may take several minutes. Watch for live updates!', 'progress');
                
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model: selectedModel })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                    addLog(`Processed ${data.processed} out of ${data.total} questions`, 'success');
                    refreshStatus();
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error processing questions: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '⚙️ Process Questions';
            }
        }

        // Auto-process all (populate + process in one go)
        async function autoProcess() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Auto-Processing...';
            
            const selectedModel = document.getElementById('modelSelect').value;
            
            try {
                addLog(`🚀 Starting auto-process with ${selectedModel}...`, 'progress');
                addLog('This will automatically populate database if empty and process all unprocessed questions.', 'progress');
                addLog('This may take several minutes. Watch for live updates!', 'progress');
                
                const response = await fetch('/api/auto-process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ model: selectedModel })
                });
                
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Server returned ${response.status}: ${text}`);
                }
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                    if (data.populated > 0) {
                        addLog(`📥 Populated ${data.populated} questions from CSV files`, 'success');
                    }
                    if (data.processed > 0) {
                        addLog(`⚙️ Processed ${data.processed} questions with ${data.model}`, 'success');
                    }
                    refreshStatus();
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error in auto-process: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🚀 Auto-Process All';
            }
        }

        // Fetch and display results
        async function fetchResults() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Loading...';
            
            const modelFilter = document.getElementById('resultsModelFilter').value;
            
            try {
                const filterText = modelFilter ? ` for ${modelFilter}` : '';
                addLog(`Fetching evaluation results${filterText}...`, 'progress');
                
                const url = modelFilter ? `/api/results?model=${modelFilter}` : '/api/results';
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.metrics);
                    addLog('✅ Results loaded successfully', 'success');
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error fetching results: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📈 View Results';
            }
        }

        // Display results
        function displayResults(metrics) {
            const resultsArea = document.getElementById('resultsArea');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsArea.style.display = 'block';
            
            let html = `
                <div class="status-grid">
                    <div class="stat-box">
                        <div class="stat-value">${metrics.totalQuestions}</div>
                        <div class="stat-label">Total Questions</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${metrics.successfulResponses}</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${metrics.overallAvgResponseTime}ms</div>
                        <div class="stat-label">Avg Response Time</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">${metrics.totalTokensUsed}</div>
                        <div class="stat-label">Total Tokens</div>
                    </div>
                </div>
                
                <h3 style="margin-top: 30px;">Results by Model</h3>
                <div class="domain-stats">
            `;
            
            // Display model-specific results
            Object.keys(metrics.models || {}).forEach(modelName => {
                const m = metrics.models[modelName];
                const successRate = ((m.successful / m.count) * 100).toFixed(1);
                html += `
                    <div class="domain-card">
                        <h3>🤖 ${modelName}</h3>
                        <div class="metric">
                            <span>Questions:</span>
                            <strong>${m.count}</strong>
                        </div>
                        <div class="metric">
                            <span>Accuracy:</span>
                            <strong>${m.accuracy}%</strong>
                        </div>
                        <div class="metric">
                            <span>Correct Answers:</span>
                            <strong>${m.correct}/${m.count}</strong>
                        </div>
                        <div class="metric">
                            <span>Avg Response Time:</span>
                            <strong>${m.avgResponseTime}ms</strong>
                        </div>
                        <div class="metric">
                            <span>Total Tokens:</span>
                            <strong>${m.totalTokens}</strong>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>
                <h3 style="margin-top: 30px;">Domain Breakdown</h3>
                <div class="domain-stats">`;
            
            Object.keys(metrics.domains).forEach(domain => {
                const d = metrics.domains[domain];
                html += `
                    <div class="domain-card">
                        <h3>${domain}</h3>
                        <div class="metric">
                            <span>Questions:</span>
                            <strong>${d.count}</strong>
                        </div>
                        <div class="metric">
                            <span>Accuracy:</span>
                            <strong>${d.accuracy}%</strong>
                        </div>
                        <div class="metric">
                            <span>Correct:</span>
                            <strong>${d.correct}/${d.count}</strong>
                        </div>
                        <div class="metric">
                            <span>Avg Response Time:</span>
                            <strong>${d.avgResponseTime}ms</strong>
                        </div>
                        <div class="metric">
                            <span>Total Tokens:</span>
                            <strong>${d.totalTokens}</strong>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            resultsContent.innerHTML = html;
        }

        // Reset processed status
        async function resetProcessedStatus() {
            if (!confirm('This will mark all questions as unprocessed. Continue?')) return;
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Resetting...';
            
            try {
                addLog('Resetting all questions to unprocessed...', 'progress');
                
                const response = await fetch('/api/reset-processed', {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ ${data.message}`, 'success');
                    refreshStatus();
                } else {
                    addLog(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error resetting: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔄 Reset to Unprocessed';
            }
        }

        // Initialize
        connectWebSocket();
        refreshStatus();
        addLog('Admin dashboard initialized', 'success');
    </script>
</body>
</html>
